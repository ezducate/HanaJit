[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hanajit"
version = "0.23.0"
description = "LLVM-backed Python JIT with transparent fallback, GPU launch support, self-contained x86-64 executable export, WebAssembly, and FPGA HLS export."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Iqbal Addou", email = "cto@ezducate.ai" },
  { name = "Iqbal Addou", email = "iqbal.addou@gmail.com" },
]
maintainers = [{ name = "Iqbal Addou", email = "cto@ezducate.ai" }]
dependencies = ["llvmlite>=0.42"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]

keywords = ["jit", "compiler", "llvm", "numpy", "performance", "numba",
            "vectorization", "gpu", "ptx", "simd", "wasm", "webassembly",
            "spirv", "vulkan", "fpga", "hls", "standalone", "executable"]

[project.urls]
Homepage = "https://www.ezducate.ai"
EZducate = "https://www.ezducate.ai"
GitHub = "https://github.com/ezducate/HanaJit"
Repository = "https://github.com/ezducate/HanaJit"
Documentation = "https://github.com/ezducate/HanaJit#readme"
Issues = "https://github.com/ezducate/HanaJit/issues"
Changelog = "https://github.com/ezducate/HanaJit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda = ["cuda-python"]
cuda-math = ["nvidia-cuda-nvcc-cu12"]  # libdevice for sin/exp/log/pow on GPU
test = ["pytest", "numpy"]
bench = ["numba", "scipy"]
scipy = ["scipy"]

[tool.setuptools.packages.find]
include = ["hanajit*"]
